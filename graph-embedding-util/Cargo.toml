[package]
name = "graph-embedding-util"
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
version = "0.8.4"

[lib]
name = "graph_embedding_util"
path = "src/lib.rs"

[features]
default = []
cuda = [
    "legume-numeric/cuda",
    "data-beans/cuda",
]
metal = [
    "legume-numeric/metal",
    "data-beans/metal",
]

[dependencies]
data-beans = { workspace = true, features = ["aux", "alg"] }
legume-numeric = { workspace = true, features = ["matrix", "param", "candle", "mcmc"] }
enrichment = { workspace = true }

anyhow = { workspace = true }
# `fit::module_args` exports the shared `--gene-modules` flag group, so every
# CLI that trains modules gets one implementation instead of a fork each. Same
# pattern as `data_beans::qc_lib::QcArgs`.
clap = { workspace = true }
ctrlc = { workspace = true }
indicatif = { workspace = true }
log = { workspace = true }
nalgebra = { workspace = true }
nalgebra-sparse = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
rayon = { workspace = true }
rustc-hash = { workspace = true }
statrs = { workspace = true }
serde = { workspace = true }

# Local-only, for the #[ignore] real-data harnesses (not committed).
[dev-dependencies]
serde_json = { workspace = true }
data-beans = { workspace = true, features = ["aux", "alg"] }
nalgebra = { workspace = true }
