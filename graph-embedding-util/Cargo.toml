[package]
name = "graph-embedding-util"
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
version = "0.2.40"

[lib]
name = "graph_embedding_util"
path = "src/lib.rs"

[features]
default = []
cuda = [
    "candle-util/cuda",
    "data-beans/cuda",
    "data-beans-alg/cuda",
    "matrix-util/cuda",
    "matrix-param/cuda",
    "mcmc-util/cuda",
]
metal = [
    "candle-util/metal",
    "data-beans/metal",
    "data-beans-alg/metal",
    "matrix-util/metal",
    "matrix-param/metal",
    "mcmc-util/metal",
]

[dependencies]
auxiliary-data = { workspace = true }
data-beans = { workspace = true }
data-beans-alg = { workspace = true }
candle-util = { workspace = true }
enrichment = { workspace = true }
matrix-param = { workspace = true }
matrix-util = { workspace = true }
mcmc-util = { workspace = true }

anyhow = { workspace = true }
# `posterior::run` exports the shared `--posterior` / `--mcmc` flag group and
# writes the run's diagnostic JSON, so both `senna bge` and `faba gem` get one
# implementation instead of a fork each. Same pattern as `data_beans::qc_lib::QcArgs`.
clap = { workspace = true }
ctrlc = { workspace = true }
indicatif = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
nalgebra = { workspace = true }
nalgebra-sparse = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
rayon = { workspace = true }
rustc-hash = { workspace = true }
statrs = { workspace = true }
serde = { workspace = true }

# Local-only, for the #[ignore] real-data harnesses (not committed).
[dev-dependencies]
candle-util = { workspace = true }
data-beans = { workspace = true }
matrix-util = { workspace = true }
nalgebra = { workspace = true }
