[package]
name = "annotate"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Cell-type annotation (projection, enrichment, ontology)"

[features]
default = []
cuda = ["graph-embedding-util/cuda", "legume-numeric/cuda"]
metal = ["graph-embedding-util/metal", "legume-numeric/metal"]

[dependencies]
data-beans = { workspace = true, features = ["aux"] }
enrichment = { workspace = true }
graph-embedding-util = { workspace = true }
legume-numeric = { workspace = true, features = ["matrix", "param", "candle"] }

anyhow = { workspace = true }
clap = { workspace = true }
log = { workspace = true }
rayon = { workspace = true }
rustc-hash = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
