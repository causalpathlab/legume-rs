[package]
name = "cnv"
license.workspace = true
authors.workspace = true
description = "Copy number variation detection from single-cell expression data"
repository.workspace = true
homepage.workspace = true
edition.workspace = true
version = "0.2.1"

[lib]
name = "cnv"
path = "src/lib.rs"

[[bin]]
name = "mung"
path = "src/main.rs"

[features]
default = []
cuda = ["matrix-util/cuda", "mcmc-util/cuda", "data-beans/cuda"]
metal = ["matrix-util/metal", "mcmc-util/metal", "data-beans/metal"]
hdf5 = ["data-beans/hdf5"]

[dependencies]
auxiliary-data = { workspace = true }
data-beans = { workspace = true }
genomic-data = { workspace = true }
matrix-util = { workspace = true }
mcmc-util = { workspace = true }

anyhow = { workspace = true }
clap = { workspace = true }
log = { workspace = true }
nalgebra = { workspace = true }
nalgebra-sparse = { workspace = true }
rayon = { workspace = true }
rustc-hash = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }

[dev-dependencies]
approx = { workspace = true }
