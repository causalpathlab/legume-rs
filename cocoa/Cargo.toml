[package]
name = "cocoa"
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Counterfactual Confounder Adjustment for Differential Analysis"

version = "0.3.1"

[[bin]]
name = "cocoa"
path = "src/main.rs"

[features]
default = []
cuda = [
    "data-beans/cuda",
    "legume-numeric/cuda",
]
metal = [
    "data-beans/metal",
    "legume-numeric/metal",
]
hdf5 = ["data-beans/hdf5"]

[dependencies]
data-beans = { workspace = true, features = ["aux", "alg", "sim"] }
legume-numeric = { workspace = true, features = ["matrix", "param", "candle", "mcmc"] }

anyhow = { workspace = true }
clap = { workspace = true }
flate2 = { workspace = true }
num_cpus = { workspace = true }
rayon = { workspace = true }
tempfile = { workspace = true }
rand = { workspace = true }
ndarray = { workspace = true }
ndarray-rand = { workspace = true }
rand_distr = { workspace = true }
nalgebra = { workspace = true }
nalgebra-sparse = { workspace = true }
approx = { workspace = true }

special = { workspace = true }
indicatif = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
rustc-hash = { workspace = true }

