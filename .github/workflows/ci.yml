name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# This repo is a meta hub: no Rust sources, only a Makefile that installs the
# legume crates from crates.io. CI checks the two things that can rot here --
# the Makefile logic, and whether the packages/features it names still exist.
jobs:
  makefile:
    name: make install (dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # A stub `cargo` that prints its arguments, and fails any GPU build so the
      # CPU-retry path gets exercised too.
      - run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/cargo" <<'EOF'
          #!/bin/sh
          echo "    cargo $*"
          case "$*" in *metal*|*cuda*) exit 1;; esac
          EOF
          chmod +x "$RUNNER_TEMP/bin/cargo"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: make help
      - run: |
          for backend in cpu cuda metal; do
            for hdf5 in on off; do
              echo "::group::BACKEND=$backend HDF5=$hdf5"
              make _install BACKEND=$backend HDF5=$hdf5 CUDA_COMPUTE_CAP=86
              echo "::endgroup::"
            done
          done
      - run: make uninstall

  crates:
    name: crates.io packages and features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Every `pkg=... supported="..."` row in the Makefile must name a
      # published crate that has each listed feature.
      - run: |
          set -euo pipefail
          fail=0
          while read -r pkg feats; do
            json=$(curl -fsS -A "legume-rs CI (github.com/causalpathlab/legume-rs)" \
              "https://crates.io/api/v1/crates/$pkg") || { echo "::error::$pkg not on crates.io"; fail=1; continue; }
            have=$(jq -r '.versions[0].features | keys[]' <<<"$json")
            for f in $feats; do
              grep -qx "$f" <<<"$have" || { echo "::error::$pkg has no feature '$f'"; fail=1; }
            done
            echo "ok: $pkg [$feats]"
          done < <(sed -nE 's/.*pkg=([^;$]+);[[:space:]]*extra_feat=([^;]*);[[:space:]]*supported="([^"]*)".*/\1 \2 \3/p' Makefile)
          exit $fail
