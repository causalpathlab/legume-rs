[workspace]

members = [
    "auxiliary-data",
    "candle-util",
    "chickpea",
    "cnv",
    "cocoa",
    "data-beans",
    "data-beans-alg",
    "data-beans-sim",
    "enrichment",
    "faba",
    "fagioli",
    "genomic-data",
    "graph-embedding-util",
    "hsblock",
    "leiden",
    "matrix-param",
    "matrix-util",
    "mcmc-util",
    "pinto",
    "plot-utils",
    "senna",
]

resolver = "3"

[workspace.package]
license = "MIT"
authors = ["Yongjin Park <ypp@stat.ubc.ca> <yongjin.park@ubc.ca>"]
description = "Library for Exploring Genomics Using Machine learning Essentials in Rust"
repository = "https://github.com/causalpathlab/legume-rs"
homepage = "https://github.com/causalpathlab/legume-rs"
edition = "2021"

# Lower bound only: `resolver = "3"` below requires Cargo 1.84. No crate here
# has been built against 1.84, so this is the floor we can prove, not a
# verified workspace MSRV -- the `msrv` CI job exists to discover the real
# number. Raise this to whatever that job reports, then make the job blocking.
rust-version = "1.84"

# NOTE: there is deliberately no `version` key here. Every crate in this
# workspace carries its own hand-maintained version (they range from 0.1.0 to
# 0.13.x), and none use `version.workspace = true`. A workspace-wide version
# would be dead config that reads as authoritative.

[workspace.dependencies]

# Core / CLI
anyhow = "1.0"
clap = { version = "4.5.20", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
env_logger = "0.11"
log = "0.4"

# Parallelism
num_cpus = "1.16.0"
rayon = "1.10.0"

# Randomness
rand = "0.10.1"
rand_distr = "0.6"
tempfile = "3.2"

# Numeric / linear algebra
approx = "0.5.1"
nalgebra = "0.34"
nalgebra-sparse = "0.11"
ndarray = { version = "0.17", features = ["rayon", "serde", "approx", "blas"] }
ndarray-rand = "0.16"
num-traits = "0.2.19"
special = "0.13"
statrs = "0.18"

# Data structures / hashing
dashmap = { version = "6.1.0", features = ["rayon"] }
rustc-hash = "2.1"

# Serialization / IO
flate2 = "1.0.34"
# arrow and parquet ship as one release train -- bump them together.
arrow = "59"
parquet = "59"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = "8"

# Bioinformatics
coitrees = "0.4"
rust-htslib = "1.0"

# Nearest neighbours / clustering
instant-distance = "0.6"
multiversion = "0.8"
clustering = { version = "0.2", features = ["parallel"] }

# Graphs (MST, Dijkstra, etc.)
petgraph = "0.8"

# Ontology / OBO flat-file parsing (Cell Ontology DAG)
fastobo = "0.15"

# Progress / display
colored = "3"
indicatif = { version = "^0.18", features = ["rayon"] }
indicatif-log-bridge = "0.2"

# 2D graphics / SVG (senna plot)
base64 = "0.22"
resvg = "0.47"
svg2pdf = "0.13"
tiny-skia = "0.12"
usvg = "0.47"

# Portable explicit SIMD
wide = "0.7"

# Internal crates
auxiliary-data = { path = "auxiliary-data" }
candle-util = { path = "candle-util" }
cnv = { path = "cnv" }
data-beans = { path = "data-beans" }
data-beans-alg = { path = "data-beans-alg" }
data-beans-sim = { path = "data-beans-sim" }
enrichment = { path = "enrichment" }
faba = { path = "faba" }
genomic-data = { path = "genomic-data" }
graph-embedding-util = { path = "graph-embedding-util" }
hsblock = { path = "hsblock" }
leiden = { path = "leiden" }
matrix-param = { path = "matrix-param" }
matrix-util = { path = "matrix-util" }
mcmc-util = { path = "mcmc-util" }
plot-utils = { path = "plot-utils" }
