[package]
name = "lineage"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Lineage inference, pseudotime, dyn-assoc, and lineage plots"

[features]
default = []
cuda = [
    "graph-embedding-util/cuda",
    "legume-numeric/cuda",
]
metal = [
    "graph-embedding-util/metal",
    "legume-numeric/metal",
]

[dependencies]
data-beans = { workspace = true, features = ["aux"] }
enrichment = { workspace = true }
graph-embedding-util = { workspace = true }
legume-numeric = { workspace = true, features = ["matrix", "param", "candle", "mcmc"] }
plot-utils = { workspace = true }

anyhow = { workspace = true }
clap = { workspace = true }
log = { workspace = true }
nalgebra = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
rayon = { workspace = true }
rustc-hash = { workspace = true }
statrs = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
