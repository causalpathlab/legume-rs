anyhow = { workspace = true }
clap = { workspace = true }
log = { workspace = true }
nalgebra = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
rayon = { workspace = true }
rustc-hash = { workspace = true }
statrs = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
