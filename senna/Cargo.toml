[package]
name = "senna"
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
version = "0.17.3"

[lib]
name = "senna"
path = "src/lib.rs"

[[bin]]
name = "senna"
path = "src/main.rs"

[features]
default = []
cuda = [
    "annotate/cuda",
    "legume-numeric/cuda",
    "cnv/cuda",
    "data-beans/cuda",
    "graph-embedding-util/cuda",
    "lineage/cuda",
]
metal = [
    "annotate/metal",
    "legume-numeric/metal",
    "cnv/metal",
    "data-beans/metal",
    "graph-embedding-util/metal",
    "lineage/metal",
]
hdf5 = ["data-beans/hdf5"]

[dependencies]
mimalloc = "0.1"
annotate = { path = "../annotate" }
cnv = { workspace = true }
data-beans = { workspace = true, features = ["aux", "alg"] }
legume-numeric = { workspace = true, features = ["matrix", "param", "candle", "mcmc"] }
genomic-data = { workspace = true }
graph-embedding-util = { workspace = true }
lineage = { path = "../lineage" }
hsblock = { workspace = true }
petgraph = { workspace = true }
enrichment = { workspace = true }
plot-utils = { workspace = true }

anyhow = { workspace = true }
clap = { workspace = true }
flate2 = { workspace = true }
num_cpus = { workspace = true }
rayon = { workspace = true }
tempfile = { workspace = true }
rand = { workspace = true }
ndarray = { workspace = true }
ndarray-rand = { workspace = true }
rand_distr = { workspace = true }
nalgebra = { workspace = true }
nalgebra-sparse = { workspace = true }
approx = { workspace = true }

special = { workspace = true }
indicatif = { workspace = true }
indicatif-log-bridge = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
dashmap = { workspace = true }
rustc-hash = { workspace = true }
statrs = { workspace = true }
colored = { workspace = true }
ctrlc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# 2D graphics / SVG (senna plot)
base64 = { workspace = true }
resvg = { workspace = true }
svg2pdf = { workspace = true }
tiny-skia = { workspace = true }
usvg = { workspace = true }
