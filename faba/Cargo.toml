[package]
name = "faba"
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true

version = "0.13.0"

[lib]
# The library surface exists so the editing statistics can be driven from
# integration tests under `tests/`. Its module docs use illustrative math
# blocks, not runnable examples, so doctests are disabled.
doctest = false

[[bin]]
name = "faba"
path = "src/main.rs"

[features]
default = []
# No `cuda` / `metal`: faba reads BAM files and writes sparse matrices, and
# nothing on that path touches a GPU. The model-fitting subcommands that did
# now live in senna, which carries those features.
#
# Forward data-beans's optional `hdf5` feature so `cargo install faba --features hdf5`
# enables the HDF5 backend + .h5/.h5ad readers (requires libhdf5 on the build host).
hdf5 = ["data-beans/hdf5"]

[dependencies]
auxiliary-data = { workspace = true }
data-beans = { workspace = true }
genomic-data = { workspace = true }
matrix-util = { workspace = true }
plot-utils = { workspace = true }

anyhow = { workspace = true }
clap = { workspace = true }
flate2 = { workspace = true }
num_cpus = { workspace = true }
rayon = { workspace = true }
tempfile = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }

indicatif = { workspace = true }
log = { workspace = true }

statrs = { workspace = true }
coitrees = { workspace = true }
parquet = { workspace = true }

rustc-hash = { workspace = true }
dashmap = { version = "6.1.0", features = ["rayon"] }
rust-htslib = { workspace = true }
arrow = "59"

serde = { workspace = true }
serde_json = { workspace = true }
