[package]
name = "gene-text"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Text side of the feature graph: a small Hugging Face encoder over gene, term and pathway descriptions, a document-frequency vocabulary, and gene–word edges for `senna fne`"

[lib]
name = "gene_text"
path = "src/lib.rs"

[[bin]]
name = "gene-text"
path = "src/main.rs"

[features]
default = []
# No HDF5 reader here; accepted as a no-op so one install line, with the
# workspace's usual feature set, serves every binary.
hdf5 = []
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda", "legume-numeric/cuda"]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal", "legume-numeric/metal"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
log = { workspace = true }
rayon = { workspace = true }
nalgebra = { workspace = true }
rustc-hash = { workspace = true }
serde_json = { workspace = true }
candle-core = { version = "0.10" }
candle-nn = { version = "0.10" }
candle-transformers = { version = "0.10" }
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
hf-hub = "0.4"
stop-words = "0.10"
rust-stemmers = "1.2"
unicode-segmentation = "1.13"
legume-numeric = { workspace = true, features = ["matrix"] }
data-beans = { workspace = true, features = ["aux"] }

[dev-dependencies]
tempfile = { workspace = true }
