[package]
name = "lupin"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Label, Unfold, Place, Interpret, Narrate — annotation, lineage, pseudotime, association, description"

[[bin]]
name = "lupin"
path = "src/main.rs"

[features]
default = []
hdf5 = ["senna/hdf5", "gene-text/hdf5"]
cuda = ["senna/cuda", "gene-text/cuda"]
metal = ["senna/metal", "gene-text/metal"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
gene-text = { path = "../gene-text" }
annotate = { path = "../annotate" }
lineage = { path = "../lineage" }
senna = { path = "../senna" }
graph-embedding-util = { workspace = true }
legume-numeric = { workspace = true, features = ["matrix"] }
serde_json = { workspace = true }
